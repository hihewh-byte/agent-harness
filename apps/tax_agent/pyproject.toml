[project]
name = "tax-agent"
version = "0.1.0"
description = "CRS overseas income tax advisory agent (CN resident, US equity v1)"
readme = "README.zh-CN.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# Backward-compatible alias; openpyxl is already in core dependencies.
parse = ["openpyxl>=3.1"]
dev = [
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.scripts]
tax-agent = "tax_agent.launcher.cli:main"
tax-agent-api = "tax_agent.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tax_agent*"]
