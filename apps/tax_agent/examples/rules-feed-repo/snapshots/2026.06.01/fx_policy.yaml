version: "2026.06.01"
defaultPolicy: safe_harbor_monthly
policies:
  safe_harbor_monthly:
    label_zh: 按交易发生日当月汇率折算
    rateSource: pboc_middle_rate
    rateDateRule: last_business_day_of_month
  safe_harbor_yearly:
    label_zh: 按纳税年度平均汇率折算
    rateSource: pboc_middle_rate
    rateDateRule: yearly_average
  user_override:
    label_zh: 用户上传汇率表
    requiresUpload: true

fallback:
  missingRate: use_nearest_prior_business_day
  maxFallbackDays: 5
